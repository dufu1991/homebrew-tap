name: Sync Norna Studio

on:
  push:
    branches: [main]
    paths: [.github/workflows/norna-studio.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: norna-studio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the public NornaKit release tools
        uses: actions/checkout@v7
        with:
          repository: dufu1991/nornakit
          ref: main
          persist-credentials: false
          sparse-checkout: Scripts/Release
      - name: Resolve the latest stable release with a Studio companion
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          release = json.loads(subprocess.check_output([
              'gh', 'api', 'repos/dufu1991/nornakit/releases/latest'
          ], text=True))
          tag = release['tag_name']
          if release['draft'] or release['prerelease'] or not re.fullmatch(r'(?:studio-)?v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag):
              raise SystemExit('Expected a stable Kit or standalone Studio release')
          if not any(asset['name'] == 'Norna-Studio-macOS-arm64.dmg' for asset in release['assets']):
              raise SystemExit('The latest release does not contain a Studio companion')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'tag={tag}\n')
          PY
      - name: Verify the published package and update only the NornaKit Cask
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 Scripts/Release/homebrew.py download --tag "$RELEASE_TAG"
          ruby -c build/release/norna-studio.rb
          python3 Scripts/Release/homebrew.py sync
